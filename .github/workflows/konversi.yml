name: Konversi KML ke DXF-PDF
on:
  push:
    paths: ['input/**']
  workflow_dispatch:
jobs:
  konversi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Konversi semua KML/KMZ di input/
        run: |
          shopt -s nullglob
          for f in input/*.kml input/*.kmz; do
            python kml2dwg.py "$f" -o output
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hasil-apd
          path: output/
